<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Forum Habiter Ensemble — Montréal 2027">
  <rect width="64" height="64" rx="2" fill="#F3EFE6" stroke="#181816" stroke-width="4"/>
  <!-- Montreal triplex cornice -->
  <rect x="6" y="6" width="52" height="14" fill="#181816"/>
  <line x1="12" y1="11" x2="52" y2="11" stroke="#E2A83E" stroke-width="2.2"/>
  <line x1="12" y1="16" x2="52" y2="16" stroke="#F3EFE6" stroke-width="1.6"/>
  <!-- Four shared dwelling quadrants -->
  <rect x="6" y="20" width="26" height="19" fill="#C24B32"/>
  <rect x="32" y="20" width="26" height="19" fill="#E2A83E"/>
  <rect x="6" y="39" width="26" height="19" fill="#2B5B44"/>
  <rect x="32" y="39" width="26" height="19" fill="#E8E2D5"/>
  <!-- Ink structural grid -->
  <line x1="32" y1="20" x2="32" y2="58" stroke="#181816" stroke-width="2.5"/>
  <line x1="6" y1="39" x2="58" y2="39" stroke="#181816" stroke-width="2.5"/>
  <!-- Central common courtyard -->
  <rect x="22" y="29" width="20" height="20" fill="#F3EFE6" stroke="#181816" stroke-width="3"/>
  <rect x="28" y="35" width="8" height="8" fill="#C24B32"/>
</svg>
